<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Tracker</title>
<meta name="description" content="Private expense tracker for India. All data stays on your device.">
<meta name="theme-color" content="#09090B" id="themeColor">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#09090B; --surface:#141417; --surface-2:#1B1B1F; --surface-3:#26262C; --border:#212126;
  --text:#F4F4F5; --muted:#8E8E97; --faint:#5E5E66;
  --accent:#3B82F6; --accent-2:#2563EB; --accent-soft:rgba(59,130,246,.15);
  --red:#F43F5E; --red-soft:rgba(244,63,94,.12); --green:#22C55E; --green-soft:rgba(34,197,94,.12); --amber:#F59E0B;
  --text-2:#D4D4D8; --icon:#A1A1AA; --tabs-bg:rgba(12,12,14,.86); --toast-bg:#F4F4F5; --toast-fg:#09090B; --shadow:none;
  --r:22px; color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#F2F3F6; --surface-3:#E7E9EE; --border:#E5E7EB;
  --text:#0B0B10; --text-2:#3F3F46; --muted:#6B6F78; --faint:#A1A5AD; --icon:#71717A;
  --accent-soft:rgba(59,130,246,.10); --red:#E11D48; --red-soft:rgba(225,29,72,.09); --green:#16A34A; --green-soft:rgba(22,163,74,.10); --amber:#D97706;
  --tabs-bg:rgba(255,255,255,.88); --toast-bg:#0B0B10; --toast-fg:#FFFFFF;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.10); color-scheme:light;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme=dark]){
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#F2F3F6; --surface-3:#E7E9EE; --border:#E5E7EB;
  --text:#0B0B10; --text-2:#3F3F46; --muted:#6B6F78; --faint:#A1A5AD; --icon:#71717A;
  --accent-soft:rgba(59,130,246,.10); --red:#E11D48; --red-soft:rgba(225,29,72,.09); --green:#16A34A; --green-soft:rgba(22,163,74,.10); --amber:#D97706;
  --tabs-bg:rgba(255,255,255,.88); --toast-bg:#0B0B10; --toast-fg:#FFFFFF;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.10); color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
b{font-weight:700}
.num{font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 20px calc(116px + env(safe-area-inset-bottom))}

/* header */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 22px;min-height:46px}
.head h1{font-size:26px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.1}
.head .subt{font-size:13px;color:var(--muted);margin-top:4px}
.head.center{display:grid;grid-template-columns:46px 1fr 46px}
.head.center h1{font-size:20px;text-align:center}
.rbtn{width:46px;height:46px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--text);flex:none;box-shadow:var(--shadow)}
.rbtn:active{transform:scale(.96)}
.rbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mnav{display:inline-flex;align-items:center;gap:4px;margin-top:4px;color:var(--muted);font-size:13px}
.mnav button{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.mnav button:hover{background:var(--surface-2);color:var(--text)}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.ch h3{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.lnk{color:var(--accent);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:2px}
.lnk.cap{font-size:12px;color:var(--accent)}
.cap{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 14px}
.sec h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)} .red{color:var(--red)} .green{color:var(--green)} .amber{color:var(--amber)} .blue{color:var(--accent)}

/* hero */
.hero{background:linear-gradient(140deg,#5B9BFF 0%,#3B82F6 45%,#2563EB 100%);border:0;color:#fff;position:relative;overflow:hidden;box-shadow:0 18px 40px -18px rgba(59,130,246,.75);padding:22px}
.hero::before{content:'';position:absolute;right:-70px;top:-90px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::after{content:'';position:absolute;right:40px;bottom:-110px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero>*{position:relative;z-index:1}
.hero .lbl{font-size:13px;opacity:.88;font-weight:500}
.hero .amt{font-size:38px;font-weight:700;letter-spacing:-.03em;margin:4px 0 4px;line-height:1.15}
.hero .pace{display:inline-block;font-size:12px;font-weight:600;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:999px;margin-top:6px}
.hero .hbar{height:6px;background:rgba(255,255,255,.22);border-radius:999px;overflow:hidden;margin:14px 0 0}
.hero .hbar i{display:block;height:100%;background:#fff;border-radius:inherit}
.hero .hbar i.over{background:#FFD1D9}
.hero .cols{display:grid;grid-template-columns:1fr 1fr;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2)}
.hero .cols>div+div{border-left:1px solid rgba(255,255,255,.2);padding-left:18px}
.hero .cols .cap{color:rgba(255,255,255,.85);display:flex;align-items:center;gap:5px}
.hero .cols .v{font-size:19px;font-weight:700;margin-top:4px;letter-spacing:-.01em}

/* pills & segmented */
.pills{display:flex;gap:8px;margin:0 0 16px}
.pill{flex:none;padding:9px 17px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:14px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:5px;margin-bottom:14px;box-shadow:var(--shadow)}
.seg button{flex:1;padding:10px 0;border-radius:13px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 6px 16px -6px rgba(59,130,246,.8)}
.pnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px;padding:0 4px}
.pnav span{font-weight:600;font-size:14px}
.pnav button{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--border)}
.pnav button:disabled{opacity:.3;cursor:default}

/* donut */
.donut-box{display:grid;place-items:center;margin:4px 0 20px}
.donut{width:176px;height:176px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px;min-width:0}
.legend .dot{width:8px;height:8px;border-radius:50%;flex:none}
.legend .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.legend .p{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}

/* icon tiles */
.ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none}

/* transactions */
.tx{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px 16px 14px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.tx:active{background:var(--surface-2)}
.tx .g{flex:1;min-width:0}
.tx .t{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.tx .a{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}
.glabel{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin:24px 4px 12px;text-transform:uppercase;display:flex;justify-content:space-between}
.search{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:0 16px;height:54px;margin-bottom:14px;color:var(--muted);box-shadow:var(--shadow)}
.search input{flex:1;background:none;border:0;outline:0;font-size:16px;color:var(--text);min-width:0}
.search input::placeholder{color:var(--faint)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:14px;font-weight:600;color:var(--text-2);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.divider{height:1px;background:var(--border);margin:16px -20px 0}

/* stats */
.badge{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
.badge.up{background:var(--red-soft);color:var(--red)}
.badge.down{background:var(--green-soft);color:var(--green)}
.bars{display:flex;align-items:flex-end;height:170px;gap:10px}
.bars.n12{gap:6px} .bars.n28,.bars.n29,.bars.n30,.bars.n31{gap:3px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;height:100%;min-width:0}
.btrack{flex:1;width:100%;max-width:32px;background:var(--surface-3);border-radius:999px;position:relative;overflow:hidden}
.bars.n28 .btrack,.bars.n29 .btrack,.bars.n30 .btrack,.bars.n31 .btrack{border-radius:4px}
.btrack i{position:absolute;left:0;right:0;bottom:0;background:rgba(59,130,246,.6);border-radius:inherit;transition:height .45s ease}
.bcol.cur .btrack i,.bcol.sel .btrack i{background:var(--accent);box-shadow:0 0 18px rgba(59,130,246,.55)}
.bcol span{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.04em;height:12px;line-height:12px}
.bcol.cur span{color:var(--accent)}
.binfo{font-size:13px;color:var(--muted);margin:-8px 0 18px;min-height:19px}
.binfo b{color:var(--text)}
.insight{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(180deg,rgba(59,130,246,.08),rgba(59,130,246,.02));border-color:rgba(59,130,246,.22);font-size:14px;line-height:1.55;color:var(--text-2)}
.insight .ib{color:var(--accent);flex:none;margin-top:1px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tiles .card{margin:0;padding:16px 18px;border-radius:20px}
.tiles .v{font-size:18px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:3px;margin-bottom:16px}
.stack i{display:block;height:100%;border-radius:999px}
.prow{display:flex;align-items:center;gap:10px;font-size:14px;padding:6px 0}
.prow .dot{width:9px;height:9px;border-radius:50%}
.prow .p{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.catcard{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:10px;display:block;width:100%;text-align:left;box-shadow:var(--shadow)}
.catcard .top{display:flex;align-items:center;gap:14px}
.catcard .g{flex:1;min-width:0}
.catcard .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catcard .s{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.catcard .s.n{text-transform:none;letter-spacing:0;font-weight:500;font-size:12.5px}
.catcard .r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.catcard .r small{display:block;font-size:11px;margin-top:2px}
.pbar{height:8px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin-top:14px}
.pbar i{display:block;height:100%;border-radius:inherit;transition:width .45s ease}
.alert{display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 12px;border-radius:12px;background:var(--red-soft);color:var(--red);font-size:12px;font-weight:600}
.okline{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.okline svg{color:var(--green)}

/* budget */
.btotal .amt{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-top:6px}
.btotal .row{display:flex;justify-content:space-between;align-items:center}
.btotal .split{display:grid;grid-template-columns:1fr 1fr;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.btotal .split>div+div{border-left:1px solid var(--border);padding-left:18px}
.btotal .split .v{font-size:19px;font-weight:700;margin-top:4px}
.ring{width:92px;height:92px;flex:none}
.binput{width:118px;text-align:right;padding:11px 12px;border-radius:13px;border:1px solid var(--border);background:var(--surface-2);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
.binput:focus{outline:2px solid var(--accent);border-color:transparent}
.setbtn{font-size:13px;font-weight:700;color:var(--accent);padding:8px 12px;border-radius:12px;background:var(--accent-soft)}
.note{font-size:13px;color:var(--muted);margin:10px 4px 0;line-height:1.5}

/* plan / goals */
.rbtn.sm{width:38px;height:38px;border-radius:13px;box-shadow:none;background:var(--surface-2)}
.gcard{padding:20px 20px 0;overflow:hidden}
.gcard .top{display:flex;align-items:center;gap:14px}
.gcard .g{flex:1;min-width:0}
.gcard .t{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .s{font-size:13px;color:var(--muted);margin-top:1px}
.gamt{margin:22px 0 16px;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.gamt small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.gtrack{position:relative;height:12px;border-radius:999px;margin:0 0 12px}
.gfill{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:999px;transition:width .45s ease}
.gexp{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-55deg,var(--c) 0 2px,transparent 2px 5px);opacity:.6;border-radius:0 999px 999px 0}
.gknob{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid var(--c);transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.glbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:16px}
.glbl b{color:var(--text)}
.gactions{display:flex;gap:10px;margin-bottom:18px}
.gactions .btn{flex:1;padding:12px}
.gbanner{display:flex;align-items:center;gap:10px;margin:0 -20px;padding:14px 20px;color:#fff;font-size:14px;font-weight:600;line-height:1.4}
.gbanner svg{flex:none}
.gnote{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);line-height:1.45}
.gnote svg{flex:none;margin-top:1px}
.icon-x{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--faint);margin-left:4px}
.icon-x:hover{background:var(--surface-3);color:var(--red)}
.btn:disabled{cursor:default}

/* profile */
.prof{text-align:center;margin:6px 0 26px}
.avatar{width:104px;height:104px;border-radius:34px;margin:0 auto;position:relative;background:linear-gradient(140deg,#5B9BFF,#2563EB);display:grid;place-items:center;font-size:38px;font-weight:700;color:#fff;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--surface-3)}
.avatar .edit{position:absolute;right:-6px;bottom:-6px;width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 0 0 4px var(--bg);color:#fff}
.prof h2{font-size:24px;margin:20px 0 4px;letter-spacing:-.02em}
.prof .h{color:var(--muted);font-size:14px}
.slist{background:var(--surface);border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.srow{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left;border-top:1px solid var(--border)}
.srow:first-child{border-top:0}
.srow:active{background:var(--surface-2)}
.srow .ic{width:42px;height:42px;border-radius:14px}
.srow .t{flex:1;font-weight:700;min-width:0}
.srow .t small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:1px}
.srow .v{color:var(--muted);font-size:13px;font-weight:600}
.srow .chev{color:var(--faint)}
.srow.danger .t{color:var(--red)}

/* empty */
.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty .ei{width:64px;height:64px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.empty b{color:var(--text);display:block;font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:15px;font-weight:700;background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:var(--red-soft);color:var(--red)}

/* tabs + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--tabs-bg);backdrop-filter:saturate(1.5) blur(18px);-webkit-backdrop-filter:saturate(1.5) blur(18px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs-in{display:flex;width:100%;max-width:480px;padding:0 8px}
.tab{flex:1;display:grid;justify-items:center;gap:4px;padding:11px 0 9px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.tab.on{color:var(--accent)}
.fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(86px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(59,130,246,.9);z-index:6}
.fab:active{transform:scale(.95)}
.fab[hidden]{display:none}

/* full-screen add/edit */
dialog{border:0;padding:0;color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog.full{width:100%;max-width:480px;height:100%;max-height:100%;margin:0 auto;background:var(--bg)}
@media (min-width:540px){dialog.full{height:min(880px,94vh);margin:auto;border-radius:30px;border:1px solid var(--border)}}
dialog.full[open]{animation:slide .25s ease}
@keyframes slide{from{transform:translateY(30px);opacity:.3}to{transform:none;opacity:1}}
.fform{display:flex;flex-direction:column;height:100%}
.fhead{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;border-bottom:1px solid var(--border)}
.fhead h2{text-align:center;font-size:19px;margin:0}
.fbody{flex:1;overflow-y:auto;padding:20px 20px 10px;overscroll-behavior:contain}
.ffoot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--bg)}
.amtcard{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:22px 20px 24px;text-align:center;margin-bottom:14px;box-shadow:var(--shadow)}
.amtrow{position:relative;display:flex;align-items:center;justify-content:center;margin-top:12px}
.amtrow .sym{position:absolute;left:8px;font-size:34px;font-weight:700;color:var(--accent)}
.amtrow input{width:100%;text-align:center;background:none;border:0;outline:0;font-size:46px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:0 40px;color:var(--text)}
.amtrow input::placeholder{color:var(--faint)}
.quick{margin-bottom:22px}
.quick .chip{font-size:13px;padding:8px 14px}
.flabel{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 2px 14px}
.tiles-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;margin-bottom:24px}
.tiles-grid input,.payseg input,.swatches input,.icgrid input{position:absolute;opacity:0;pointer-events:none}
.tiles-grid label{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;min-width:0}
.tiles-grid .tile{width:58px;height:58px;border-radius:19px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--icon);transition:.15s;box-shadow:var(--shadow)}
.tiles-grid .tl{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.tiles-grid input:checked+label .tile{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.tiles-grid input:checked+label .tl{color:var(--accent)}
.tiles-grid input:focus-visible+label .tile{outline:2px solid var(--accent);outline-offset:4px}
.payseg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:24px}
.payseg label{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--icon);cursor:pointer;box-shadow:var(--shadow)}
.payseg input:checked+label{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.payseg input:checked+label svg{color:var(--accent)}
.irow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:0 16px;height:56px;margin-bottom:12px;color:var(--muted);box-shadow:var(--shadow)}
.irow input{flex:1;background:none;border:0;outline:0;font-size:16px;color:var(--text);min-width:0;height:100%}
.irow input::placeholder{color:var(--faint)}
.irow input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.45}
.irow:focus-within{border-color:var(--accent)}
.err{color:var(--red);font-size:13px;min-height:18px;margin:2px 4px 0;font-weight:600}
.cta{width:100%;height:58px;border-radius:19px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;box-shadow:0 14px 30px -14px rgba(59,130,246,.9)}
.cta:active{transform:scale(.99)}

/* add sheet extras */
.kindseg{margin-bottom:12px}
.kindseg button{letter-spacing:.04em}
.smsbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:14px;border:1.5px dashed var(--border);color:var(--accent);font-size:13.5px;font-weight:600;margin-bottom:14px;background:var(--accent-soft)}
.smsinfo{font-size:13px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin:-4px 0 14px;line-height:1.45}
.smsinfo b{color:var(--text)}
.payseg.src{grid-template-columns:repeat(3,1fr)}
.opts .srow{cursor:pointer}
.oi{width:38px!important;height:38px!important;border-radius:12px!important;background:var(--accent-soft);color:var(--accent)}
.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:var(--surface-3);position:relative;flex:none;cursor:pointer;transition:.2s;margin:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw:checked{background:var(--accent)}
.sw:checked::after{left:23px}
.subopt{padding:4px 16px 14px 68px;border-top:1px solid var(--border)}
.subopt .irow{height:46px;margin:8px 0;background:var(--surface-2)}
.chk{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text-2);padding-top:10px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.splitrow{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:8px 0;color:var(--text-2)}
.stepper{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:12px;padding:3px}
.stepper button{width:32px;height:32px;border-radius:10px;font-size:18px;font-weight:700;color:var(--accent)}
.stepper button:hover{background:var(--surface-3)}
.tx .a.green{color:var(--green)}
.tx .tagp{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--green-soft);color:var(--green);margin-right:4px;vertical-align:1px}

/* bottom sheets */
dialog.sheet{width:100%;max-width:480px;margin:auto auto 0;border-radius:28px 28px 0 0;background:var(--surface);border-top:1px solid var(--border);max-height:92vh;overflow-y:auto}
@media (min-width:540px){dialog.sheet{margin:auto;border-radius:28px;border:1px solid var(--border)}}
dialog.sheet[open]{animation:slide .22s ease}
.sform{padding:12px 20px calc(18px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:999px;background:var(--surface-3);margin:0 auto 16px}
.sform h3{font-size:19px;margin:0 0 18px}
.sform .irow{background:var(--surface-2)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.swatches label{aspect-ratio:1;border-radius:14px;cursor:pointer;display:grid;place-items:center;color:#fff}
.swatches label svg{opacity:0}
.swatches input:checked+label{box-shadow:0 0 0 3px var(--surface),0 0 0 5px currentColor}
.swatches input:checked+label svg{opacity:1}
.icgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:20px}
.icgrid label{aspect-ratio:1;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;color:var(--icon);cursor:pointer}
.icgrid input:checked+label{background:var(--accent);border-color:var(--accent);color:#fff}
.sactions{display:flex;gap:10px;margin-top:8px}
.sactions .btn{flex:1;padding:14px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:16px;border:1px solid var(--border);background:var(--surface-2);margin-bottom:8px;font-weight:600;text-align:left}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .ck{margin-left:auto;color:var(--accent)}

/* install / update banner */
.banner{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:16px;box-shadow:0 24px 60px -16px rgba(0,0,0,.5);z-index:30;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
.banner[hidden]{display:none}
@keyframes pop{from{transform:translate(-50%,40px)}to{transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.banner,dialog[open]{animation:none!important}}
.banner .row{display:flex;gap:14px;align-items:flex-start}
.banner img{width:54px;height:54px;border-radius:15px;flex:none;box-shadow:0 6px 16px -6px rgba(14,124,102,.6)}
.banner .bt{font-weight:700;font-size:16px;margin-top:2px}
.banner .bd{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.banner .bd svg{vertical-align:-4px;color:var(--accent)}
.banner .x{margin-left:auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--faint);flex:none}
.banner .x:hover{background:var(--surface-2)}
.banner .ba{display:flex;gap:10px;margin-top:14px}
.banner .ba .btn{flex:1;padding:12px}
body.has-banner .fab{opacity:0;pointer-events:none}
.steps{list-style:none;padding:0;margin:0 0 18px;counter-reset:s}
.steps li{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--border);font-size:15px;counter-increment:s}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;flex:none;font-size:14px}
.steps li svg{color:var(--accent);vertical-align:-5px}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--toast-bg);color:var(--toast-fg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:6px}
.toast-act{margin-left:10px;font-weight:700;color:var(--accent);padding:2px 4px}
/* dashboard extras */
.fc .row3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fc .v{font-size:19px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.fc .msg{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:13.5px;line-height:1.45;color:var(--text-2)}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:left}
.flow .v{font-size:17px;font-weight:700;margin-top:4px}
.qa{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 4px;padding:2px 20px 6px;scrollbar-width:none}
.qa::-webkit-scrollbar{display:none}
.qbtn{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);font-size:14px;font-weight:600}
.qbtn .ic{width:30px!important;height:30px!important;border-radius:10px!important}
.qbtn small{color:var(--muted);font-weight:600;margin-left:2px}
.qbtn:active{transform:scale(.97)}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
/* calendar heatmap */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{font-size:10px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.05em;padding-bottom:2px}
.cal .dc{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--text-2);position:relative;border:1.5px solid transparent}
.cal .dc small{font-size:8.5px;font-weight:700;opacity:.85;margin-top:1px}
.cal .dc.today{border-color:var(--accent)}
.cal .dc.sel{outline:2px solid var(--text);outline-offset:1px}
.cal .dc.fut{opacity:.35}
.cal .dc.blank{background:none}
.legend-h{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:12px;justify-content:flex-end}
.legend-h i{width:14px;height:14px;border-radius:4px;display:inline-block}
</style>
</head>
<body>
<div class="app"><main id="main"></main></div>

<button class="fab" id="fab" data-action="add" aria-label="Add expense"></button>
<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs"></div></nav>

<!-- Add / edit expense (full screen) -->
<dialog class="full" id="txDlg" aria-labelledby="txTitle">
  <form class="fform" id="txForm" novalidate>
    <div class="fhead">
      <button type="button" class="rbtn" data-action="close-dlg" aria-label="Back" id="txBack"></button>
      <h2 id="txTitle">Add Expense</h2>
      <button type="button" class="rbtn" data-action="delete-expense" aria-label="Delete expense" id="txDelete" style="color:var(--red)"></button>
    </div>
    <div class="fbody">
      <div class="seg kindseg" id="txKind" role="tablist" aria-label="Type">
        <button type="button" data-action="tx-kind" data-k="expense">Expense</button>
        <button type="button" data-action="tx-kind" data-k="income">Income</button>
        <button type="button" data-action="tx-kind" data-k="credit">Refund</button>
      </div>
      <button type="button" class="smsbtn" id="smsBtn" data-action="paste-sms"><span id="smsIc"></span> Paste a bank / UPI SMS to fill this in</button>
      <div class="smsinfo" id="smsInfo" hidden></div>
      <div class="amtcard">
        <div class="cap" id="txAmtLabel">Amount spent</div>
        <div class="amtrow"><span class="sym">₹</span><input id="txAmount" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Amount in rupees"></div>
      </div>
      <div class="chips quick" id="quickAmts"></div>
      <div id="catBlock"><div class="flabel" id="catLabel">Select category</div>
      <div class="tiles-grid" id="txCats" role="radiogroup" aria-label="Category"></div></div>
      <div id="srcBlock" hidden><div class="flabel">Source</div>
      <div class="payseg src" id="txSrc" role="radiogroup" aria-label="Income source"></div></div>
      <div class="flabel" id="payLabel">Paid via</div>
      <div class="payseg" id="txPay" role="radiogroup" aria-label="Payment mode"></div>
      <label class="irow" id="noteRow"><input id="txNote" maxlength="80" placeholder="Add a description… (e.g. Chai, auto fare)"></label>
      <label class="irow" id="dateRow"><input type="date" id="txDate" aria-label="Date"></label>
      <div id="optBlock">
        <div class="flabel" style="margin-top:20px">Options</div>
        <div class="slist opts">
          <label class="srow" id="optRepeat"><span class="ic oi" id="oiRepeat"></span><div class="t">Repeat every month<small id="repeatSub">Added automatically each month</small></div><input type="checkbox" class="sw" id="txRepeat"></label>
          <div class="subopt" id="repeatMore" hidden><label class="chk"><input type="checkbox" id="txSub"> It’s a subscription (Netflix, Spotify, gym…)</label></div>
          <label class="srow" id="optSplit"><span class="ic oi" id="oiSplit"></span><div class="t">Split with others<small>Only your share counts as your expense</small></div><input type="checkbox" class="sw" id="txSplit"></label>
          <div class="subopt" id="splitMore" hidden>
            <div class="splitrow"><span>People, including you</span>
              <div class="stepper"><button type="button" data-action="split-n" data-d="-1" aria-label="Fewer people">−</button><b id="splitN">2</b><button type="button" data-action="split-n" data-d="1" aria-label="More people">+</button></div></div>
            <div class="splitrow"><span>Your share</span><b id="splitMine" class="num blue">₹0</b></div>
            <label class="irow"><input id="splitNames" maxlength="120" placeholder="Their names, comma separated (optional)"></label>
            <label class="chk"><input type="checkbox" id="splitOwe" checked> Track what they owe me</label>
          </div>
          <label class="srow" id="optFav"><span class="ic oi" id="oiFav"></span><div class="t">Save to quick-add<small>One-tap button on the dashboard</small></div><input type="checkbox" class="sw" id="txFav"></label>
        </div>
      </div>
      <div class="smsinfo" id="editInfo" hidden></div>
      <div class="err" id="txErr"></div>
    </div>
    <div class="ffoot"><button type="submit" class="cta" id="txSave">Save Expense</button></div>
  </form>
</dialog>

<!-- Category editor -->
<dialog class="sheet" id="catDlg" aria-labelledby="catTitle">
  <form class="sform" id="catForm" novalidate>
    <div class="grab"></div>
    <h3 id="catTitle">New category</h3>
    <label class="irow"><input id="catName" maxlength="24" placeholder="Category name, e.g. Coffee"></label>
    <div class="flabel" style="margin-top:8px">Icon</div>
    <div class="icgrid" id="catIcons"></div>
    <div class="flabel">Colour</div>
    <div class="swatches" id="catColors"></div>
    <div class="err" id="catErr"></div>
    <div class="sactions">
      <button type="button" class="btn danger" id="catDelete" data-action="delete-cat">Delete</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</dialog>

<!-- Savings goal editor -->
<dialog class="sheet" id="goalDlg" aria-labelledby="goalTitle">
  <form class="sform" id="goalForm" novalidate>
    <div class="grab"></div>
    <h3 id="goalTitle">New goal</h3>
    <label class="irow"><input id="goalName" maxlength="30" placeholder="Goal name, e.g. Goa Trip"></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <label class="irow"><span style="font-weight:700;color:var(--accent)">₹</span><input id="goalTarget" type="text" inputmode="decimal" placeholder="Target amount" autocomplete="off"></label>
      <label class="irow"><input id="goalDate" type="date" aria-label="Target date (optional)"></label>
    </div>
    <p class="note" style="margin:-4px 2px 14px">Target date is optional — set one to see if you’re on schedule.</p>
    <div class="flabel">Icon</div>
    <div class="icgrid" id="goalIcons"></div>
    <div class="flabel">Colour</div>
    <div class="swatches" id="goalColors"></div>
    <div class="err" id="goalErr"></div>
    <div class="sactions">
      <button type="button" class="btn danger" id="goalDelete" data-action="delete-goal">Delete</button>
      <button type="submit" class="btn">Save goal</button>
    </div>
  </form>
</dialog>

<!-- Generic sheet (name, payment default, privacy, goal details, add money) -->
<dialog class="sheet" id="sheetDlg">
  <form class="sform" id="sheetForm" novalidate><div class="grab"></div><div id="sheetBody"></div></form>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="banner" id="banner" hidden role="dialog" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ================= On-device storage (IndexedDB) =================
   Nothing leaves this device. No network calls, no analytics. */
const DB_NAME = 'expense-tracker', DB_VERSION = 3, STORES = ['categories', 'expenses', 'budgets', 'settings', 'goals', 'recurring', 'ious'];
let db;
function openDB() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = () => {
      const d = r.result; // v1: core stores · v2: savings goals · v3: recurring rules, lent/borrowed
      for (const [s, keyPath] of [['categories', 'id'], ['expenses', 'id'], ['budgets', 'key'], ['settings', 'key'], ['goals', 'id'], ['recurring', 'id'], ['ious', 'id']])
        if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath });
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
const done = t => new Promise((res, rej) => { t.oncomplete = res; t.onerror = t.onabort = () => rej(t.error); });
const dbAll = s => new Promise((res, rej) => { const r = db.transaction(s).objectStore(s).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
function dbPut(s, ...items) { const t = db.transaction(s, 'readwrite'); items.forEach(i => t.objectStore(s).put(i)); return done(t); }
function dbDel(s, key) { const t = db.transaction(s, 'readwrite'); t.objectStore(s).delete(key); return done(t); }
function dbClearAll() { const t = db.transaction(STORES, 'readwrite'); STORES.forEach(s => t.objectStore(s).clear()); return done(t); }

/* ================= Icons (line style, 24px grid) ================= */
const ICONS = {
  // categories
  cart: '<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2A2 2 0 0 0 9.6 17h7.7a2 2 0 0 0 2-1.5L21 8H6"/>',
  utensils: '<path d="M4 3v7a3 3 0 0 0 3 3v8M10 3v7a3 3 0 0 1-3 3M7 3v7"/><path d="M18 21V3c-2.3 1.2-3.6 3.9-3.6 7v4H18"/>',
  scooter: '<circle cx="5.5" cy="17.5" r="2.5"/><circle cx="18.5" cy="17.5" r="2.5"/><path d="M8 17.5h7.6L13.5 7H11M13.5 7H16M15 12.5H9.5L8 10H4"/>',
  coffee: '<path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 2.5v2.5M12 2.5v2.5"/>',
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v12h14V9"/><path d="M10 21v-6h4v6"/>',
  fuel: '<path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M3 21h13M4 11h11"/><path d="M15 8h2a2 2 0 0 1 2 2v7a1.5 1.5 0 0 0 3 0V9l-3-3"/>',
  car: '<path d="M5 17H3v-5l2.2-5h13.6L21 12v5h-2"/><path d="M3 12h18"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/><path d="M9.5 17h5"/>',

      return { label: i % 7 === 0 ? String(d.getDate()) : '', full: d.toLocaleDateString(LOCALE, { weekday: 'short', day: 'numeric', month: 'short' }), start: k, end: k, cur: k === today }; });
    return { start: cr.start, end: cr.end, label: cycleLabel(m), buckets, noun: cycleDay() === 1 ? 'month' : 'cycle', key: m };
  }
  const y = now.getFullYear() + offset;

    return { label: new Date(y, i, 1).toLocaleDateString('en-IN', { month: 'short' }).toUpperCase(), full: monthLabel(m), start: `${m}-01`, end: `${m}-${pad(daysInMonth(m))}`, cur: m === thisMonth() }; });

function donut(segs, total, size = 176) {
  const R = 15.9155, gap = segs.length > 1 ? 1.4 : 0; let cum = 0;

    cum += p; return el; }).join('');
  return `<svg class="donut" style="width:${size}px;height:${size}px" viewBox="0 0 42 42" role="img" aria-label="Spending by category">
    <circle r="${R}" cx="21" cy="21" fill="none" stroke="var(--surface-3)" stroke-width="3.6"/>${rings}

}

function forecastInfo(m) {
  const r = cycleRange(m), today = todayStr();
  if (today < r.start || today > r.end) return null;
  const list = expensesIn(r.start, r.end), spent = Math.max(0, spendSum(list));
  const total = diffDays(r.start, r.end) + 1, elapsed = diffDays(r.start, today) + 1, left = total - elapsed;
  const variable = Math.max(0, spendSum(list.filter(e => !e.recurringId)));
  const upcoming = sum(S.recurring.filter(x => x.active && x.kind !== 'income' && nextDue(x) > today && nextDue(x) <= r.end).map(x => x.amount));
  const projected = round2(spent + variable / elapsed * left + upcoming);
  return { spent, avg: spent / elapsed, projected, upcoming, end: r.end, elapsed };
}

async function saveIou() {
  const person = $('iPerson').value.trim(), amount = parseAmount($('iAmt').value);
  if (!person) return ($('iErr').textContent = 'Who is it with?');
  if (!(amount > 0)) return ($('iErr').textContent = 'Enter an amount.');
  const i = { ...(S.editingIou || { id: uid(), createdAt: Date.now() }), person, amount, dir: $('iDir').value, note: $('iNote').value.trim(), date: $('iDate').value || todayStr(), due: $('iDue').value || undefined };
  if (!i.due) delete i.due;
  await dbPut('ious', i); const idx = S.ious.findIndex(x => x.id === i.id); idx >= 0 ? (S.ious[idx] = i) : S.ious.push(i);
  $('sheetDlg').close(); render(); toast(i.dir === 'lent' ? `${person} owes you ${fmt(amount)}` : `You owe ${person} ${fmt(amount)}`);

async function setIou(id, patch) {
  const i = S.ious.find(x => x.id === id); if (!i) return;
  const n = { ...i, ...patch }; for (const k of Object.keys(n)) if (n[k] === undefined) delete n[k];

}

function viewStats() {
  const r = rangeOf(S.period, S.statsOffset), prev = rangeOf(S.period, S.statsOffset - 1);
  const list = expensesIn(r.start, r.end), total = Math.max(0, spendSum(list));
  const prevList = expensesIn(prev.start, prev.end), prevTotal = Math.max(0, spendSum(prevList));
  const change = prevTotal > 0 ? Math.round((total - prevTotal) / prevTotal * 100) : null;
  const vals = r.buckets.map(b => Math.max(0, spendSum(expensesIn(b.start, b.end))));
  const max = Math.max(...vals, 1);
  const n = r.buckets.length;
  const days = daysElapsed(r);
  const avg = days ? total / days : 0;

  const seg = `<div class="seg">${['week', 'month', 'year'].map(p => `<button class="${S.period === p ? 'on' : ''}" data-action="stats-period" data-p="${p}">${p}</button>`).join('')}</div>`;
  const pnav = `<div class="pnav"><button data-action="stats-prev" aria-label="Previous">${icon('chevL', 18, 2.2)}</button><span>${esc(r.label)}</span><button data-action="stats-next" aria-label="Next" ${S.statsOffset >= 0 ? 'disabled' : ''}>${icon('chevR', 18, 2.2)}</button></div>`;
  const badge = change === null || change === 0 ? '' : `<span class="badge ${change > 0 ? 'up' : 'down'}">${icon(change > 0 ? 'up' : 'down', 12, 2.6)} ${Math.abs(change)}%</span>`;
  const bars = r.buckets.map((b, i) => `<button class="bcol ${b.cur ? 'cur' : ''}" data-action="bar" data-i="${i}" title="${esc(b.full)}: ${esc(fmt(vals[i]))}">
      <div class="btrack"><i style="height:${vals[i] ? Math.max(4, vals[i] / max * 100) : 0}%"></i></div><span>${b.label}</span></button>`).join('');
  S._bars = r.buckets.map((b, i) => ({ full: b.full, v: vals[i] }));
  const flow = `<section class="card">
    <div class="ch"><h3>Spending Flow</h3>${badge}</div>
    <div class="binfo" id="barInfo">Total <b>${esc(fmt(total))}</b> · ${change === null ? 'no data for previous ' + r.noun : `${Math.abs(change)}% ${change >= 0 ? 'more' : 'less'} than previous ${r.noun}`}</div>
    <div class="bars n${n}">${bars}</div></section>`;

  const byCat = Object.entries(totalsByCat(list)).map(([id, v]) => ({ c: catById(id), v })).sort((a, b) => b.v - a.v);
  const prevByCat = totalsByCat(prevList);
  const top = byCat[0];
  let ins;
  if (!total) ins = `No spending recorded for ${esc(r.label.toLowerCase().startsWith('this') || r.label.toLowerCase().startsWith('last') ? r.label.toLowerCase() : r.label)} yet.`;
  else {
    ins = change === null ? '' : change > 0 ? `<b>Insight:</b> You spent <b class="red">${change}% more</b> than the previous ${r.noun}. ` : change < 0 ? `<b>Nice!</b> You spent <b class="green">${-change}% less</b> than the previous ${r.noun}. ` : `Same spending as the previous ${r.noun}. `;
    ins += `<b>${esc(top.c.name)}</b> is your biggest expense at ${Math.round(top.v / total * 100)}%${change > 10 && !['home', 'bank'].includes(top.c.icon) ? ' — cutting back there will help you stay on track.' : '.'}`;
  }
  const insight = `<section class="card insight"><span class="ib">${icon('bulb', 22)}</span><div>${ins}</div></section>`;

  const tiles = `<div class="tiles"><div class="card"><div class="cap">Total spent</div><div class="v num">${esc(fmt(total))}</div></div>
    <div class="card"><div class="cap">Daily average</div><div class="v num">${esc(fmt(Math.round(avg)))}</div></div></div>`;

  const byPay = {}; list.forEach(e => { const k = e.payment || 'Other'; byPay[k] = round2((byPay[k] || 0) + sv(e)); }); for (const k in byPay) if (byPay[k] <= 0) delete byPay[k];
  const modes = [...PAYMENT_MODES, ['Other', 'tag', '#64748B']].filter(([m]) => byPay[m]);
  const pay = total ? `<section class="card"><div class="ch"><h3>Paid via</h3></div>
    <div class="stack">${modes.map(([m, , col]) => `<i style="width:${byPay[m] / total * 100}%;background:${col}"></i>`).join('')}</div>
    ${modes.map(([m, ic, col]) => `<div class="prow"><span class="dot" style="background:${col}"></span>${esc(m)}<span class="muted" style="margin-left:6px;font-size:13px">${Math.round(byPay[m] / total * 100)}%</span><span class="p">${esc(fmt(byPay[m]))}</span></div>`).join('')}</section>` : '';

  const topCats = byCat.length ? `<div class="sec"><h2>Top Categories</h2></div>` + byCat.map(({ c, v }) => {
    const pv = prevByCat[c.id] || 0, ch = pv ? Math.round((v - pv) / pv * 100) : null;

  return `<header class="head"><h1>Statistics</h1><button class="rbtn" data-action="stats-today" aria-label="Back to current period">${icon('calendar', 20)}</button></header>

  const overall = overallBudget(m), catSum = totalBudget(m), pool = round2(overall - catSum);

  const ringLen = Math.min(100, pct);
  const head = `<header class="head"><div><h1>Budget</h1>

      <svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(--surface-3)" stroke-width="3.2"/>
        ${total ? `<circle cx="18" cy="18" r="15.9155" fill="none" stroke="${STATUS_COLOR[st]}" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="${ringLen} ${100 - ringLen}" transform="rotate(-90 18 18)"/>` : ''}
        <text x="18" y="20.2" text-anchor="middle" font-size="7" font-weight="700" style="fill:var(--text)">${total ? Math.round(pct) + '%' : '—'}</text></svg></div>
    <div class="split"><div><div class="cap">Spent</div><div class="v num red">${esc(fmt(spent))}</div></div>
      <div><div class="cap">${total && spent > total ? 'Over' : 'Left'}</div><div class="v num ${total && spent > total ? 'red' : 'green'}">${total ? esc(fmt(Math.abs(total - spent))) : '—'}</div></div></div></section>`;

  if (S.budgetEdit) {
    const ob = budgetFor(TOTAL_KEY, m);
    const overallCard = `<section class="card" style="border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)">

        <input class="binput" id="overallInput" type="text" inputmode="decimal" placeholder="₹ —" data-cat="${TOTAL_KEY}" value="${ob.limit || ''}" aria-label="Overall monthly budget"></div>
      <div class="muted" style="font-size:12.5px;margin-top:12px;line-height:1.45" id="bAlloc">${allocLine(m)}</div></section>`;
    const rows = S.categories.map(c => { const b = budgetFor(c.id, m);
      return `<div class="catcard"><div class="top">${tint(c)}<div class="g"><div class="t">${esc(c.name)}</div>
        <div class="s n" id="bsub-${c.id}">Spent ${esc(fmt(spend[c.id] || 0))}${b.inherited ? ` · from ${esc(monthLabel(b.from, 'short'))}` : ''}</div></div>
        <input class="binput" type="text" inputmode="decimal" placeholder="Optional" data-cat="${c.id}" value="${b.limit || ''}" aria-label="Monthly limit for ${esc(c.name)}"></div></div>`; }).join('');

      <p class="note" style="margin:-6px 4px 14px">Only add limits for categories you want to watch closely. Everything without a limit is covered by your overall budget.</p>${rows}
      <p class="note">Budgets carry over to the following months automatically. A change here applies from ${esc(cycleLabel(m))} onward. Leave a field blank to remove it.</p>`;
  }

  if (!total) return head + totalCard + emptyCard('target', 'Set a monthly budget', 'Start with one number for the whole month. You can add limits for specific categories later — only if you want to.', `<button class="btn" data-action="budget-edit" data-focus="overall">${icon('plus', 18, 2.4)} Set monthly budget</button>`);

  const withB = S.categories.map(c => ({ c, s: spend[c.id] || 0, l: budgetFor(c.id, m).limit })).filter(x => x.l > 0).sort((a, b) => b.s / b.l - a.s / a.l);
  const cards = withB.map(({ c, s, l }) => { const stt = status(s, l), p = s / l * 100;
    return `<button class="catcard" data-action="goto-cat" data-id="${c.id}"><div class="top">${tint(c)}
      <div class="g"><div class="t">${esc(c.name)}</div><div class="s n">${esc(fmt(s))} of ${esc(fmt(l))}</div></div>
      <div class="r ${stt === 'over' ? 'red' : stt === 'warn' ? 'amber' : ''}">${Math.round(p)}%</div></div>
      <div class="pbar"><i style="width:${Math.min(100, p)}%;background:${STATUS_COLOR[stt]}"></i></div>
      ${stt === 'over' ? `<div class="alert">${icon('alert', 15, 2.2)} Exceeded budget by ${esc(fmt(s - l))}</div>` : `<div class="okline"><span>${esc(fmt(l - s))} remaining</span>${icon('check', 16, 2.2)}</div>`}</button>`; }).join('');
  const unb = S.categories.filter(c => !(budgetFor(c.id, m).limit > 0) && spend[c.id]).sort((a, b) => spend[b.id] - spend[a.id]);

    const restCats = S.categories.filter(c => !(budgetFor(c.id, m).limit > 0)).length;
    const lim = Math.max(0, pool), stt = lim ? status(restSpent, lim) : (restSpent > 0 ? 'over' : 'ok'), p = lim ? restSpent / lim * 100 : (restSpent ? 100 : 0);

        <div class="pbar"><i style="width:${Math.min(100, p)}%;background:${STATUS_COLOR[stt]}"></i></div>

    rest = restCard + breakdown;
  } else {
    rest = `<section class="card insight" style="margin-top:6px"><span class="ib">${icon('wallet', 22)}</span><div><b>Add an overall budget</b> to cover the categories without a limit, so all your spending is tracked against one number.
      <div style="margin-top:10px"><button class="setbtn" data-action="budget-edit" data-focus="overall">Set overall budget</button></div></div></section>` +
      (unb.length ? `<div class="sec"><h2>No limit set</h2></div><div class="slist">${unb.map(c => `<div class="srow">${tint(c, 42, 14)}<div class="t">${esc(c.name)}<small>Spent ${esc(fmt(spend[c.id]))}</small></div><button class="setbtn" data-action="budget-edit">Set</button></div>`).join('')}</div>` : '');
  }
  const catHead = withB.length ? `<div class="sec"><h2>Category limits</h2><button class="lnk cap" data-action="budget-edit">EDIT</button></div>` : `<div class="sec"><h2>Spending</h2><button class="lnk cap" data-action="budget-edit">ADD LIMITS</button></div>`;
  return head + totalCard + catHead + cards + rest;
}

function goalInfo(g) {
  const saved = sum((g.contributions || []).map(c => c.amount));
  const pct = g.target ? Math.min(100, Math.max(0, saved / g.target * 100)) : 0;
  const left = Math.max(0, round2(g.target - saved));
  const r = { saved, pct, left, exp: null, state: 'none', need: 0, msg: 'Add a target date to track your pace.' };
  if (saved >= g.target) return { ...r, state: 'done', msg: 'Goal reached — well done! 🎉' };
  if (!g.deadline) return r;
  const today = todayStr(), total = diffDays(g.start, g.deadline), daysLeft = diffDays(today, g.deadline);
  r.exp = total > 0 ? Math.min(100, Math.max(0, diffDays(g.start, today) / total * 100)) : 100;
  r.need = Math.ceil(left / Math.max(1, daysLeft / 30.44));
  const by = parseDate(g.deadline).toLocaleDateString(LOCALE, { month: 'short', year: 'numeric' });
  if (daysLeft < 0) return { ...r, state: 'late', msg: `Target date passed · ${fmt(left)} still to go.` };
  if (r.exp - pct > 5) return { ...r, state: 'behind', msg: `You’re ${Math.round(r.exp - pct)}% behind schedule. Save ${fmt(r.need)}/month to catch up.` };
  return { ...r, state: 'ok', msg: `On track! Save ${fmt(r.need)}/month to reach it by ${by}.` };
}

function goalBar(g, gi) {

    ${e > a ? `<i class="gexp" style="left:${a}%;width:${e - a}%"></i>` : ''}<i class="gfill" style="width:${a}%"></i>
    <span class="gknob" style="left:clamp(10px,${a}%,calc(100% - 10px))"></span></div>`;
}

const dueDate = (month, day) => `${month}-${pad(Math.min(day, daysInMonth(month)))}`;
const nextDue = r => dueDate(r.lastPosted ? shiftMonth(r.lastPosted, 1) : r.start, r.day);
const ruleVisual = r => r.kind === 'income' ? { name: r.source || 'Income', icon: (INCOME_SOURCES.find(x => x[0] === r.source) || INCOME_SOURCES[0])[1], color: '#16A34A' } : catById(r.categoryId);
/* Posts every due entry up to today (catches up if the app wasn't opened for a while). */
async function postRecurring() {
  const today = todayStr(), cur = thisMonth(), created = [], updated = [];
  for (const r of S.recurring) {
    if (!r.active) continue;
    let m = r.lastPosted ? shiftMonth(r.lastPosted, 1) : r.start, n = 0, changed = false;
    while (m <= cur && n++ < 36) {
      const d = dueDate(m, r.day); if (d > today) break;
      const e = { id: uid(), amount: r.amount, kind: r.kind, categoryId: r.categoryId, source: r.source, payment: r.payment, note: r.name, date: d, recurringId: r.id, createdAt: Date.now() + n };
      for (const k of Object.keys(e)) if (e[k] === undefined || e[k] === null && k !== 'categoryId') delete e[k];
      created.push(e); r.lastPosted = m; changed = true; m = shiftMonth(m, 1);
    }
    if (changed) updated.push(r);
  }
  if (created.length) { await dbPut('expenses', ...created); S.expenses.push(...created); }
  if (updated.length) await dbPut('recurring', ...updated);
  return created;
}

/* ================= Calendar heatmap ================= */
function calendarHTML(r) {
  const today = todayStr(), byDay = {};
  expensesIn(r.start, r.end).forEach(e => byDay[e.date] = round2((byDay[e.date] || 0) + sv(e)));
  const max = Math.max(...Object.values(byDay).filter(v => v > 0), 1), start = parseDate(r.start), n = diffDays(r.start, r.end) + 1;
  const short = v => v >= 100000 ? (v / 100000).toFixed(1) + 'L' : v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : String(Math.round(v));
  const alpha = [0, .16, .34, .58, .9];
  let cells = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<div class="dh">${d}</div>`).join('') + '<div class="dc blank"></div>'.repeat((start.getDay() + 6) % 7);
  for (let i = 0; i < n; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const k = ds(d), v = byDay[k] || 0, lvl = v > 0 ? Math.max(1, Math.ceil(Math.sqrt(v / max) * 4)) : 0;
    cells += `<button class="dc ${k === today ? 'today' : ''} ${k > today ? 'fut' : ''} ${S.calDay === k ? 'sel' : ''}" data-action="cal-day" data-d="${k}" style="${lvl ? `background:rgba(59,130,246,${alpha[lvl]});${lvl >= 3 ? 'color:#fff' : ''}` : ''}" aria-label="${esc(d.toLocaleDateString(LOCALE, { day: 'numeric', month: 'short' }))}: ${esc(fmt(v))}">${d.getDate()}${v > 0 ? `<small>${short(v)}</small>` : ''}</button>`;
  }
  const noSpend = [...Array(n)].filter((_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); const k = ds(d); return k <= today && !(byDay[k] > 0); }).length;
  let detail = '';
  if (S.calDay && S.calDay >= r.start && S.calDay <= r.end) {
    const items = S.expenses.filter(e => e.date === S.calDay).sort((a, b) => b.createdAt - a.createdAt);

function reportData() {
  const r = rangeOf('month', S.period === 'month' ? S.statsOffset : 0), prev = rangeOf('month', (S.period === 'month' ? S.statsOffset : 0) - 1);
  const list = expensesIn(r.start, r.end), total = Math.max(0, spendSum(list)), prevTotal = Math.max(0, spendSum(expensesIn(prev.start, prev.end)));
  const byCat = Object.entries(totalsByCat(list)).map(([id, v]) => ({ c: catById(id), v })).sort((a, b) => b.v - a.v);
  const byDay = {}; list.forEach(e => byDay[e.date] = round2((byDay[e.date] || 0) + sv(e)));
  const big = Object.entries(byDay).sort((a, b) => b[1] - a[1])[0];

  const note = $('txNote').value.trim();
  const payment = document.querySelector('input[name=txPay]:checked')?.value || '';
  // Split: the entered amount is the whole bill; only my share is my expense
  let split = editing?.split || null, amount = entered;
  if (!editing && k === 'expense' && $('txSplit').checked && S.splitN > 1) split = { total: entered, n: S.splitN };
  if (split && k === 'expense') { split = { ...split, total: entered }; amount = round2(entered / split.n); } else split = null;
  const base = { amount, kind: k === 'expense' ? undefined : k, categoryId, source, date, note, payment, split: split || undefined };
  const e = editing ? { ...editing, ...base, updatedAt: Date.now() } : { id: uid(), ...base, createdAt: Date.now() };
  for (const key of Object.keys(e)) if (e[key] === undefined) delete e[key];

  if (!editing && $('txRepeat').checked && k !== 'credit') {
    const rule = { id: uid(), name: note || (k === 'income' ? source : catById(categoryId).name), amount, kind: k === 'income' ? 'income' : undefined, categoryId, source, payment,
      day: +date.slice(8), start: date.slice(0, 7), lastPosted: date.slice(0, 7), active: true, subscription: k === 'expense' && $('txSub').checked, createdAt: Date.now() };
    for (const key of Object.keys(rule)) if (rule[key] === undefined) delete rule[key];

  let extra = '';

      : [{ id: uid(), person: `${split.n - 1} ${split.n - 1 === 1 ? 'person' : 'people'} (split)`, amount: round2(entered - share), dir: 'lent', note: `Split: ${what}`, date, createdAt: Date.now() }];

  }

  if (!editing && k !== 'income') await setSetting('lastCategory', categoryId);
  $('txDlg').close(); render();
  const label = k === 'income' ? `Income ${fmt(amount)} · ${source}` : k === 'credit' ? `Refund ${fmt(amount)} · ${catById(categoryId).name}` : `Added ${fmt(amount)} · ${catById(categoryId).name}`;
  toast(editing ? 'Updated' : label + (e.recurringId && !editing ? ' · repeats monthly' : '') + extra);
  if (k === 'expense') budgetAlerts(categoryId, date, amount);
}
function budgetAlerts(categoryId, date, amount) {
  const m = cycleKey(date), cr = cycleRange(m), list = expensesIn(cr.start, cr.end), limit = budgetFor(categoryId, m).limit;
  const spent = spendSum(list.filter(x => x.categoryId === categoryId)), monthTotal = spendSum(list), budget = effectiveBudget(m);
  if (limit && spent > limit) setTimeout(() => toast(`⚠️ ${catById(categoryId).name} is ${fmt(spent - limit)} over its limit`), 2500);
  else if (budget && monthTotal > budget && monthTotal - amount <= budget) setTimeout(() => toast(`⚠️ Monthly budget exceeded by ${fmt(monthTotal - budget)}`), 2500);
}

/* ================= Paste a bank / UPI SMS (parsed on this device only) ================= */
const MERCHANT_ICON = [
  [/zomato|swiggy|eatsure|dominos|domino's|pizza ?hut|kfc|mcdonald|faasos|box8/i, 'scooter'],
  [/blinkit|zepto|bigbasket|big basket|instamart|dmart|d-mart|jiomart|grofers|more retail|reliance fresh|spencer|kirana|grocery/i, 'cart'],
  [/uber|ola|rapido|metro|namma yatri|blusmart|auto|cab|irctc ?ut|fastag|toll/i, 'car'],
  [/petrol|fuel|hpcl|bpcl|iocl|indian ?oil|bharat ?petroleum|hindustan ?petroleum|shell|nayara/i, 'fuel'],
  [/jio|airtel|vodafone|\bvi\b|bsnl|act ?fibernet|hathway|tata ?play|recharge|broadband/i, 'phone'],
  [/netflix|hotstar|jiocinema|prime ?video|spotify|youtube|bookmyshow|pvr|inox|sonyliv|zee5|apple\.com|google ?play/i, 'film'],
  [/amazon|flipkart|myntra|ajio|meesho|nykaa|tata ?cliq|decathlon|lifestyle|westside|croma|reliance ?digital/i, 'bag'],
  [/apollo|pharmeasy|1mg|netmeds|medplus|hospital|clinic|pharma|diagnostic|lab/i, 'heart'],
  [/irctc|makemytrip|goibibo|indigo|air ?india|vistara|akasa|redbus|cleartrip|ixigo|oyo|airbnb/i, 'train'],
  [/electricity|bescom|tneb|tangedco|msedcl|mahadiscom|tpddl|bses|cesc|wbsedcl|apdcl|tsecl|indane|bharat ?gas|hp ?gas|piped gas|mgl|igl/i, 'zap'],
  [/\bemi\b|loan|bajaj ?fin|home ?credit|credit ?card ?bill/i, 'bank'],
  [/\brent\b|nobroker|housing/i, 'home'],
  [/school|college|university|udemy|coursera|byju|unacademy|tuition|fees/i, 'book'],
  [/chai|tea|cafe|coffee|starbucks|ccd|restaurant|hotel|dhaba|bakery|sweets/i, 'utensils'],
];
function parseSms(text) {
  const t = text.replace(/\s+/g, ' ').trim();
  const am = t.match(/(?:rs\.?|inr|₹)\s*([\d,]+(?:\.\d{1,2})?)/i) || t.match(/([\d,]+(?:\.\d{1,2})?)\s*(?:rs\.?|inr|₹)/i);
  if (!am) return null;
  const amount = parseAmount(am[1]);
  const isRefund = /refund|reversal|reversed|cashback/i.test(t);
  const isCredit = /credited|received|deposited|added to/i.test(t) && !/debited|spent|paid|sent|withdrawn/i.test(t);
  const kind = isRefund ? 'credit' : isCredit ? 'income' : 'expense';
  let merchant = '';
  const pats = [/(?:to|at|towards|trf to|paid to|sent to)\s+(?:vpa\s+)?([A-Za-z0-9 &.'@_-]{2,40}?)(?=\s+(?:on|via|ref|upi|for|from|dated|avl|avbl|bal|a\/c|is|was)\b|[.,;]|$)/i,
    /for\s+(?:your\s+)?([A-Za-z][A-Za-z0-9&.'-]{1,30})\s+order/i, /\bby\s+([A-Za-z][A-Za-z0-9 &.'-]{2,40}?)(?=\s+(?:on|via|ref|upi|avl|avbl|bal)\b|[.,;]|$)/i,
    /info[:\s]+(?:upi\/)?(?:[\w-]+\/)*([A-Za-z][A-Za-z0-9 &.'-]{2,30})/i, /from\s+([A-Za-z][A-Za-z0-9 &.'@_-]{2,40}?)(?=\s+(?:on|via|ref|upi|to)\b|[.,;]|$)/i];
  for (const p of pats) { const mm = t.match(p); if (mm && !/^(a\/?c|ac|acct|account|your|xx)/i.test(mm[1])) { merchant = mm[1].trim(); break; } }
  merchant = merchant.replace(/@.*$/, '').replace(/[._-]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (merchant) merchant = merchant.split(' ').slice(0, 4).map(w => w.length > 3 && w === w.toUpperCase() ? w[0] + w.slice(1).toLowerCase() : w[0].toUpperCase() + w.slice(1)).join(' ');
  let date;
  const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  const d1 = t.match(/\b(\d{1,2})[-/ ]([A-Za-z]{3})[-/ ,]*(\d{2,4})\b/), d2 = t.match(/\b(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})\b/);
  const mk = (d, m, y) => { y = +y < 100 ? 2000 + +y : +y; const dt = new Date(y, m - 1, +d); return dt.getDate() === +d && dt <= new Date() ? ds(dt) : undefined; };
  const d3 = t.match(/\b(20\d{2})-(\d{1,2})-(\d{1,2})\b/);
  if (d3) date = mk(d3[3], +d3[2], d3[1]); else if (d1 && MON[d1[2].toLowerCase()]) date = mk(d1[1], MON[d1[2].toLowerCase()], d1[3]); else if (d2) date = mk(d2[1], +d2[2], d2[3]);
  const payment = /upi|vpa|@ok|@ybl|@paytm|@axl|@ibl|gpay|phonepe/i.test(t) ? 'UPI' : /card|pos\b/i.test(t) ? 'Card' : /neft|imps|rtgs|net ?banking/i.test(t) ? 'Net Banking' : /atm|cash/i.test(t) ? 'Cash' : undefined;
  let categoryId;
  const hay = merchant + ' ' + t, hit = MERCHANT_ICON.find(([re]) => re.test(hay));
  if (hit) categoryId = S.categories.find(c => c.icon === hit[1])?.id;
  return { amount, kind, note: merchant, date, payment, categoryId, source: kind === 'income' ? (/salary|sal\b/i.test(t) ? 'Salary' : /interest/i.test(t) ? 'Interest' : 'Other') : undefined };
}
function applyParsed(p) {
  if (!p) { $('smsInfo').hidden = false; $('smsInfo').innerHTML = 'Couldn’t find an amount in that message. Try copying the full SMS.'; return; }
  openExpense(null, p);
  const k = { expense: 'expense', income: 'income', credit: 'refund' }[p.kind];
  $('smsInfo').hidden = false;
  $('smsInfo').innerHTML = `Filled from SMS: <b>${esc(fmt(p.amount))}</b> ${k}${p.note ? ` · <b>${esc(p.note)}</b>` : ''}${p.date ? ` · ${esc(dayLabel(p.date))}` : ''}${p.categoryId ? '' : ' · pick a category'}. Check it and save.`;
}
async function pasteSms() {
  let text = '';
  try { if (navigator.clipboard?.readText) text = await navigator.clipboard.readText(); } catch {}
  if (text && /(rs\.?|inr|₹)\s*[\d,]/i.test(text)) return applyParsed(parseSms(text));
  openSheet('sms');
}

async function saveCat(ev) {
  ev.preventDefault();

  if (S.categories.some(c => c.name.toLowerCase() === name.toLowerCase() && c.id !== S.editingCat?.id)) return ($('catErr').textContent = 'A category with this name already exists.');
  const ic = document.querySelector('input[name=catIcon]:checked')?.value || 'tag';

  const c = S.editingCat ? { ...S.editingCat, name, icon: ic, color } : { id: uid(), name, icon: ic, color, order: Math.max(0, ...S.categories.map(x => x.order || 0)) + 1 };
  await dbPut('categories', c);
  const i = S.categories.findIndex(x => x.id === c.id);

async function deleteCat() {
  const c = S.editingCat; if (!c) return;
  if (S.categories.length <= 1) return ($('catErr').textContent = 'You need at least one category.');
  const fallback = S.categories.find(x => x.id !== c.id && x.name === 'Other') || S.categories.find(x => x.id !== c.id);
  const affected = S.expenses.filter(e => e.categoryId === c.id);
  if (!confirm(affected.length ? `Delete "${c.name}"? Its ${affected.length} expense(s) will move to "${fallback.name}".` : `Delete "${c.name}"?`)) return;
  const moved = affected.map(e => ({ ...e, categoryId: fallback.id }));
  if (moved.length) await dbPut('expenses', ...moved);
  moved.forEach(m => { S.expenses[S.expenses.findIndex(e => e.id === m.id)] = m; });
  for (const k of Object.keys(S.budgets).filter(k => S.budgets[k].categoryId === c.id)) { await dbDel('budgets', k); delete S.budgets[k]; }
  await dbDel('categories', c.id);
  S.categories = S.categories.filter(x => x.id !== c.id);
  if (S.txFilter === 'cat:' + c.id) S.txFilter = '';
  $('catDlg').close(); render(); toast('Category deleted');
}

/* ================= Data ================= */
async function setSetting(key, value) { S.settings[key] = value; await dbPut('settings', { key, value }); }

async function saveBudget(input) {
  const catId = input.dataset.cat, m = S.month, raw = input.value.trim();
  const limit = raw === '' ? 0 : parseAmount(raw);
  const cur = budgetFor(catId, m);
  if (!(limit >= 0)) { toast('Enter a valid amount'); input.value = cur.limit || ''; return; }
  if (limit === cur.limit && !cur.inherited) return;
  const b = { key: `${m}|${catId}`, month: m, categoryId: catId, limit };
  await dbPut('budgets', b); S.budgets[b.key] = b;
  input.value = limit || '';
  if ($('bAlloc')) $('bAlloc').innerHTML = allocLine(m);
  if (catId === TOTAL_KEY) {
    $('bsub-' + catId).textContent = 'One number for the whole month';
    return toast(limit ? `Monthly budget: ${fmt(limit)}` : 'Overall budget removed');
  }
  const cr = cycleRange(m), sp = spendSum(expensesIn(cr.start, cr.end).filter(e => e.categoryId === catId));
  $('bsub-' + catId).textContent = `Spent ${fmt(sp)}`;
  toast(limit ? `${catById(catId).name}: ${fmt(limit)}/month` : `Limit removed for ${catById(catId).name}`);
}
function exportJSON() {
  const data = { app: 'expense-tracker', version: 3, exportedAt: new Date().toISOString(), settings: S.settings, categories: S.categories, expenses: S.expenses, budgets: Object.values(S.budgets), goals: S.goals, recurring: S.recurring, ious: S.ious };
