<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Tracker</title>
<meta name="description" content="Private expense tracker for India. All data stays on your device.">
<meta name="theme-color" content="#09090B" id="themeColor">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app"><main id="main"></main></div>

<button class="fab" id="fab" data-action="add" aria-label="Add expense"></button>
<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs"></div></nav>

<!-- Add / edit expense (full screen) -->
<dialog class="full" id="txDlg" aria-labelledby="txTitle">
  <form class="fform" id="txForm" novalidate>
    <div class="fhead">
      <button type="button" class="rbtn" data-action="close-dlg" aria-label="Back" id="txBack"></button>
      <h2 id="txTitle">Add Expense</h2>
      <button type="button" class="rbtn" data-action="delete-expense" aria-label="Delete expense" id="txDelete" style="color:var(--red)"></button>
    </div>
    <div class="fbody">
      <div class="seg kindseg" id="txKind" role="tablist" aria-label="Type">
        <button type="button" data-action="tx-kind" data-k="expense">Expense</button>
        <button type="button" data-action="tx-kind" data-k="income">Income</button>
        <button type="button" data-action="tx-kind" data-k="credit">Refund</button>
      </div>
      <button type="button" class="smsbtn" id="smsBtn" data-action="paste-sms"><span id="smsIc"></span> Paste a bank / UPI SMS to fill this in</button>
      <div class="smsinfo" id="smsInfo" hidden></div>
      <div class="amtcard">
        <div class="cap" id="txAmtLabel">Amount spent</div>
        <div class="amtrow"><span class="sym">₹</span><input id="txAmount" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Amount in rupees"></div>
      </div>
      <div class="chips quick" id="quickAmts"></div>
      <div id="catBlock"><div class="flabel" id="catLabel">Select category</div>
      <div class="tiles-grid" id="txCats" role="radiogroup" aria-label="Category"></div></div>
      <div id="srcBlock" hidden><div class="flabel">Source</div>
      <div class="payseg src" id="txSrc" role="radiogroup" aria-label="Income source"></div></div>
      <div class="flabel" id="payLabel">Paid via</div>
      <div class="payseg" id="txPay" role="radiogroup" aria-label="Payment mode"></div>
      <label class="irow" id="noteRow"><input id="txNote" maxlength="80" placeholder="Add a description… (e.g. Chai, auto fare)"></label>
      <label class="irow" id="dateRow"><input type="date" id="txDate" aria-label="Date"></label>
      <div id="optBlock">
        <div class="flabel" style="margin-top:20px">Options</div>
        <div class="slist opts">
          <label class="srow" id="optRepeat"><span class="ic oi" id="oiRepeat"></span><div class="t">Repeat every month<small id="repeatSub">Added automatically each month</small></div><input type="checkbox" class="sw" id="txRepeat"></label>
          <div class="subopt" id="repeatMore" hidden><label class="chk"><input type="checkbox" id="txSub"> It’s a subscription (Netflix, Spotify, gym…)</label></div>
          <label class="srow" id="optSplit"><span class="ic oi" id="oiSplit"></span><div class="t">Split with others<small>Only your share counts as your expense</small></div><input type="checkbox" class="sw" id="txSplit"></label>
          <div class="subopt" id="splitMore" hidden>
            <div class="splitrow"><span>People, including you</span>
              <div class="stepper"><button type="button" data-action="split-n" data-d="-1" aria-label="Fewer people">−</button><b id="splitN">2</b><button type="button" data-action="split-n" data-d="1" aria-label="More people">+</button></div></div>
            <div class="splitrow"><span>Your share</span><b id="splitMine" class="num blue">₹0</b></div>
            <label class="irow"><input id="splitNames" maxlength="120" placeholder="Their names, comma separated (optional)"></label>
            <label class="chk"><input type="checkbox" id="splitOwe" checked> Track what they owe me</label>
          </div>
          <label class="srow" id="optFav"><span class="ic oi" id="oiFav"></span><div class="t">Save to quick-add<small>One-tap button on the dashboard</small></div><input type="checkbox" class="sw" id="txFav"></label>
        </div>
      </div>
      <div class="smsinfo" id="editInfo" hidden></div>
      <div class="err" id="txErr"></div>
    </div>
    <div class="ffoot"><button type="submit" class="cta" id="txSave">Save Expense</button></div>
  </form>
</dialog>

<!-- First-time setup -->
<dialog class="full" id="onbDlg" aria-label="Set up">
  <form class="fform" id="onbForm" novalidate>
    <div class="fhead" style="border:0;grid-template-columns:1fr auto">
      <div class="dots" id="onbDots"></div>
      <button type="button" class="lnk" data-action="onb-skip" style="color:var(--muted)">Skip</button>
    </div>
    <div class="fbody onb" id="onbBody" tabindex="-1" autofocus style="outline:none"></div>
    <div class="ffoot onbfoot" style="border:0;display:flex"><button type="button" class="btn ghost" id="onbBack" data-action="onb-back">Back</button><button type="submit" class="cta" id="onbNext">Continue</button></div>
  </form>
</dialog>

<!-- Category editor -->
<dialog class="sheet" id="catDlg" aria-labelledby="catTitle">
  <form class="sform" id="catForm" novalidate>
    <div class="grab"></div>
    <h3 id="catTitle">New category</h3>
    <label class="irow"><input id="catName" maxlength="24" placeholder="Category name, e.g. Coffee"></label>
    <div class="flabel" style="margin-top:8px">Icon</div>
    <div class="icgrid" id="catIcons"></div>
    <div class="flabel">Colour</div>
    <div class="swatches" id="catColors"></div>
    <div class="err" id="catErr"></div>
    <div class="sactions">
      <button type="button" class="btn danger" id="catDelete" data-action="delete-cat">Delete</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</dialog>

<!-- Savings goal editor -->
<dialog class="sheet" id="goalDlg" aria-labelledby="goalTitle">
  <form class="sform" id="goalForm" novalidate>
    <div class="grab"></div>
    <h3 id="goalTitle">New goal</h3>
    <label class="irow"><input id="goalName" maxlength="30" placeholder="Goal name, e.g. Goa Trip"></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <label class="irow"><span style="font-weight:700;color:var(--accent)">₹</span><input id="goalTarget" type="text" inputmode="decimal" placeholder="Target amount" autocomplete="off"></label>
      <label class="irow"><input id="goalDate" type="date" aria-label="Target date (optional)"></label>
    </div>
    <p class="note" style="margin:-4px 2px 14px">Target date is optional — set one to see if you’re on schedule.</p>
    <div class="flabel">Icon</div>
    <div class="icgrid" id="goalIcons"></div>
    <div class="flabel">Colour</div>
    <div class="swatches" id="goalColors"></div>
    <div class="err" id="goalErr"></div>
    <div class="sactions">
      <button type="button" class="btn danger" id="goalDelete" data-action="delete-goal">Delete</button>
      <button type="submit" class="btn">Save goal</button>
    </div>
  </form>
</dialog>

<!-- Generic sheet (name, payment default, privacy, goal details, add money) -->
<dialog class="sheet" id="sheetDlg">
  <form class="sform" id="sheetForm" novalidate><div class="grab"></div><div id="sheetBody"></div></form>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="banner" id="banner" hidden role="dialog" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/core.js" defer></script>
<script src="js/views.js" defer></script>
<script src="js/features.js" defer></script>
<script src="js/forms.js" defer></script>
<script src="js/main.js" defer></script>
</body>
</html>
